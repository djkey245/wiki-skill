[project]
name = "wikipedia-interest-dev"
version = "0.1.0"
description = "Dev environment for the wikipedia-interest Agent Skill (the skill itself has no runtime dependencies)"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "scipy",
    "pymannkendall",
    "matplotlib",
    "jsonschema>=4.25.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts", "evals"]
testpaths = ["tests"]
markers = [
    "live: hits the real Wikimedia APIs (run explicitly with -m live)",
]
addopts = "-m 'not live'"
